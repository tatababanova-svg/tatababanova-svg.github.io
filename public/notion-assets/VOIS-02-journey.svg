<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="962" viewBox="0 0 1680 962"><rect width="1680" height="962" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">VOIS · ПУТЬ КЛИЕНТА</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">10 точек, где выбор может стать сложнее</text><rect x="48" y="150" width="230.58227848101265" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Этап</text><rect x="278.5822784810126" y="150" width="601.5189873417721" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Главный вопрос / риск</text><rect x="880.1012658227847" y="150" width="751.8987341772151" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Что должно помочь</text><rect x="48" y="208" width="230.58227848101265" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">1. Узнавание</text><rect x="278.5822784810126" y="208" width="601.5189873417721" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Почему обратить внимание на бренд именно сейчас?</text><rect x="880.1012658227847" y="208" width="751.8987341772151" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Материал первого контакта связывать с конкретной потребностью и</text><text x="894.1012658227847" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">наблюдаемым результатом</text><rect x="48" y="292" width="230.58227848101265" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">2. Интерес</text><rect x="278.5822784810126" y="292" width="601.5189873417721" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Есть ли здесь продукт под мою задачу?</text><rect x="880.1012658227847" y="292" width="751.8987341772151" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Быстро показать релевантную категорию и понятную продуктовую</text><text x="894.1012658227847" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">причину выбора</text><rect x="48" y="376" width="230.58227848101265" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">3. Исследование</text><rect x="278.5822784810126" y="376" width="601.5189873417721" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Что выбрать и почему обещанию можно доверять?</text><rect x="880.1012658227847" y="376" width="751.8987341772151" height="56" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Результат + реалистичные ожидания + доказательство с контекстом</text><rect x="48" y="432" width="230.58227848101265" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">4. Сравнение</text><rect x="278.5822784810126" y="432" width="601.5189873417721" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Чем похожие продукты отличаются?</text><rect x="880.1012658227847" y="432" width="751.8987341772151" height="56" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Сравнить 2–3 варианта по одинаковым критериям</text><rect x="48" y="488" width="230.58227848101265" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">5. Выбор</text><rect x="278.5822784810126" y="488" width="601.5189873417721" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Подойдёт ли это именно моей ситуации?</text><rect x="880.1012658227847" y="488" width="751.8987341772151" height="56" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Лёгкий подбор по потребности и ясные критерии соответствия</text><rect x="48" y="544" width="230.58227848101265" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">6. Покупка</text><rect x="278.5822784810126" y="544" width="601.5189873417721" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Какую версию и формат я получу; всё ли совместимо?</text><rect x="880.1012658227847" y="544" width="751.8987341772151" height="56" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Понятно объяснить версии, упаковку, совместимость и канал</text><rect x="48" y="600" width="230.58227848101265" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">7. Первый опыт</text><rect x="278.5822784810126" y="600" width="601.5189873417721" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Как правильно использовать и какие ощущения</text><text x="292.5822784810126" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нормальны?</text><rect x="880.1012658227847" y="600" width="751.8987341772151" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Короткие подсказки: дозировка, частота, способ применения,</text><text x="894.1012658227847" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ожидаемые ощущения</text><rect x="48" y="684" width="230.58227848101265" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">8. Привычка</text><rect x="278.5822784810126" y="684" width="601.5189873417721" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Комфортно ли пользоваться регулярно?</text><rect x="880.1012658227847" y="684" width="751.8987341772151" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Снизить предотвратимые трудности применения и отслеживать сигналы</text><text x="894.1012658227847" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">комфорта</text><rect x="48" y="768" width="230.58227848101265" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">9. Повторная покупка</text><rect x="278.5822784810126" y="768" width="601.5189873417721" height="56" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Как повторить удачную покупку без нового поиска?</text><rect x="880.1012658227847" y="768" width="751.8987341772151" height="56" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Совместимый сменный блок, быстрый повтор, ясность версии и выгоды</text><rect x="48" y="824" width="230.58227848101265" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">10. Рекомендация</text><rect x="278.5822784810126" y="824" width="601.5189873417721" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="292.5822784810126" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Что добавить дальше и могу ли рекомендовать бренд?</text><rect x="880.1012658227847" y="824" width="751.8987341772151" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="894.1012658227847" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Следующая отдельная потребность + релевантное доказательство +</text><text x="894.1012658227847" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">запрос отзыва после успешного опыта</text><text x="48" y="942" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>