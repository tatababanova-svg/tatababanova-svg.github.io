<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1102" viewBox="0 0 1680 1102"><rect width="1680" height="1102" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · ПЕРВЫЕ 30 ДНЕЙ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">8 задач, которые переводят стратегию в работу</text><rect x="48" y="150" width="60.151898734177216" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">№</text><rect x="108.15189873417722" y="150" width="220.55696202531647" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Блок</text><rect x="328.7088607594937" y="150" width="521.3164556962025" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Действие первых 30 дней</text><rect x="850.0253164556962" y="150" width="350.88607594936707" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Зачем</text><rect x="1200.9113924050632" y="150" width="431.0886075949367" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Критерий готовности</text><rect x="48" y="208" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">1</text><rect x="108.15189873417722" y="208" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Данные / Битрикс24</text><rect x="328.7088607594937" y="208" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Обязательные поля: источник, продукт,</text><text x="342.7088607594937" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">компания, роль, стадия, сигнал, критерий</text><text x="342.7088607594937" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">выбора, причина проигрыша, ключевые даты</text><rect x="850.0253164556962" y="208" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Без единой модели данных</text><text x="864.0253164556962" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нельзя сравнивать каналы и</text><text x="864.0253164556962" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">продукты</text><rect x="1200.9113924050632" y="208" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Тестовая сделка каждого продукта</text><text x="1214.9113924050632" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">проходит без пустых критичных полей</text><rect x="48" y="320" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">2</text><rect x="108.15189873417722" y="320" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Финансы / атрибуция</text><rect x="328.7088607594937" y="320" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Связать сделку с фактической выручкой,</text><text x="342.7088607594937" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">себестоимостью и валовой прибылью</text><rect x="850.0253164556962" y="320" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Не оценивать каналы только по</text><text x="864.0253164556962" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">лидам или выручке</text><rect x="1200.9113924050632" y="320" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Можно построить отчёт источник →</text><text x="1214.9113924050632" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">продукт → договор → фактическая</text><text x="1214.9113924050632" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">валовая прибыль</text><rect x="48" y="432" width="60.151898734177216" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">3</text><rect x="108.15189873417722" y="432" width="220.55696202531647" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Продажи → операции</text><rect x="328.7088607594937" y="432" width="521.3164556962025" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Внедрить минимумы квалификации и коды</text><text x="342.7088607594937" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">возврата / проигрыша</text><rect x="850.0253164556962" y="432" width="350.88607594936707" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Не перегружать операции</text><text x="864.0253164556962" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">неполными запросами</text><rect x="1200.9113924050632" y="432" width="431.0886075949367" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Операции принимают запросы по единому</text><text x="1214.9113924050632" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">правилу или возвращают с кодом</text><rect x="48" y="516" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">4</text><rect x="108.15189873417722" y="516" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Продукты / сайт</text><rect x="328.7088607594937" y="516" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Две страницы продуктов-ядра: регулярный</text><text x="342.7088607594937" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">импорт и проектная поставка</text><rect x="850.0253164556962" y="516" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">До трафика нужны отдельные</text><text x="864.0253164556962" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">точки входа</text><rect x="1200.9113924050632" y="516" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Один продукт, один основной призыв,</text><text x="1214.9113924050632" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">продуктовая форма, без недоказанных</text><text x="1214.9113924050632" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">цифр</text><rect x="48" y="628" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">5</text><rect x="108.15189873417722" y="628" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Формы</text><rect x="328.7088607594937" y="628" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">4 короткие входные формы по продуктам,</text><text x="342.7088607594937" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">включая «не знаю»</text><rect x="850.0253164556962" y="628" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Одна универсальная форма либо</text><text x="864.0253164556962" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">перегружает, либо недодаёт</text><text x="864.0253164556962" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">данных</text><rect x="1200.9113924050632" y="628" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Каждая форма даёт минимум для</text><text x="1214.9113924050632" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">корректного следующего шага</text><rect x="48" y="740" width="60.151898734177216" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">6</text><rect x="108.15189873417722" y="740" width="220.55696202531647" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доказательства</text><rect x="328.7088607594937" y="740" width="521.3164556962025" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Собрать кейсы, постатейный расчёт, карту</text><text x="342.7088607594937" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ролей, пример статуса / эскалации</text><rect x="850.0253164556962" y="740" width="350.88607594936707" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Сильные сообщения должны иметь</text><text x="864.0253164556962" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">операционные доказательства</text><rect x="1200.9113924050632" y="740" width="431.0886075949367" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">По каждому ядру есть 2–3 проверяемых</text><text x="1214.9113924050632" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">материала</text><rect x="48" y="824" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">7</text><rect x="108.15189873417722" y="824" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Коммерческое</text><text x="122.15189873417722" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">предложение</text><rect x="328.7088607594937" y="824" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Единый стандарт: задача → схема → включено /</text><text x="342.7088607594937" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">не включено → переменные → риски →</text><text x="342.7088607594937" y="916" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доказательства</text><rect x="850.0253164556962" y="824" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Одна ставка не поддерживает</text><text x="864.0253164556962" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">новое позиционирование</text><rect x="1200.9113924050632" y="824" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Шаблоны КП для двух ядер и</text><text x="1214.9113924050632" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">стандартизированный расчёт</text><rect x="48" y="936" width="60.151898734177216" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">8</text><rect x="108.15189873417722" y="936" width="220.55696202531647" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="122.15189873417722" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Прямые продажи</text><rect x="328.7088607594937" y="936" width="521.3164556962025" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="342.7088607594937" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Пробная серия только по проверяемым сигналам</text><rect x="850.0253164556962" y="936" width="350.88607594936707" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="864.0253164556962" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Проверить канал без массовой</text><text x="864.0253164556962" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">рассылки</text><rect x="1200.9113924050632" y="936" width="431.0886075949367" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1214.9113924050632" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Каждая компания имеет сигнал,</text><text x="1214.9113924050632" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">продукт, релевантные роли и полезный</text><text x="1214.9113924050632" y="1028" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">первый материал</text><text x="48" y="1082" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>