<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920"><rect width="1680" height="920" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">VOIS · 4 ИЗ 7 ЭКРАНОВ ПРОТОТИПА</text><text x="48" y="105" font-family="Arial" font-size="38" font-weight="700" fill="#18273B">Как новая логика помогает выбрать до покупки</text>
<rect x="48" y="155" width="778" height="330" rx="22" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="2"/><rect x="48" y="155" width="10" height="330" rx="5" fill="#647C6E"/><text x="82" y="201" font-family="Arial" font-size="18" font-weight="700" fill="#647C6E">ЭКРАН 01</text><text x="82" y="243" font-family="Arial" font-size="28" font-weight="700" fill="#18273B">Первый экран</text><text x="82" y="292" font-family="Arial" font-size="21" fill="#243142">Увлажнение без ощущения липкости.</text><text x="82" y="323" font-family="Arial" font-size="21" fill="#243142">Для сухой, нормальной и комбинированной кожи.</text><text x="82" y="354" font-family="Arial" font-size="21" fill="#243142">30 мл · основная упаковка / сменный блок.</text>
<rect x="854" y="155" width="778" height="330" rx="22" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="2"/><rect x="854" y="155" width="10" height="330" rx="5" fill="#18273B"/><text x="888" y="201" font-family="Arial" font-size="18" font-weight="700" fill="#647C6E">ЭКРАН 02</text><text x="888" y="243" font-family="Arial" font-size="28" font-weight="700" fill="#18273B">Подойдёт, если</text><text x="888" y="292" font-family="Arial" font-size="21" fill="#243142">Главная задача — увлажнение и уменьшение стянутости.</text><text x="888" y="323" font-family="Arial" font-size="21" fill="#243142">Важна лёгкая текстура и простой ежедневный уход.</text>
<rect x="48" y="513" width="778" height="330" rx="22" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="2"/><rect x="48" y="513" width="10" height="330" rx="5" fill="#18273B"/><text x="82" y="559" font-family="Arial" font-size="18" font-weight="700" fill="#647C6E">ЭКРАН 03</text><text x="82" y="601" font-family="Arial" font-size="28" font-weight="700" fill="#18273B">Сравнить до покупки</text><text x="82" y="650" font-family="Arial" font-size="21" fill="#243142">2–3 сыворотки по одинаковым критериям:</text><text x="82" y="681" font-family="Arial" font-size="21" fill="#243142">задача · компоненты · ощущение · применение.</text>
<rect x="854" y="513" width="778" height="330" rx="22" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="2"/><rect x="854" y="513" width="10" height="330" rx="5" fill="#647C6E"/><text x="888" y="559" font-family="Arial" font-size="18" font-weight="700" fill="#647C6E">ЭКРАН 04</text><text x="888" y="601" font-family="Arial" font-size="28" font-weight="700" fill="#18273B">Что подтверждено</text><text x="888" y="650" font-family="Arial" font-size="21" fill="#243142">Источник + выборка + ограничение.</text><text x="888" y="681" font-family="Arial" font-size="21" fill="#243142">Не превращать небольшое исследование в гарантию эффекта.</text>
<rect x="48" y="866" width="1584" height="36" rx="12" fill="#E7ECE6"/><text x="70" y="891" font-family="Arial" font-size="17" font-weight="700" fill="#647C6E">Инициативный прототип на открытых данных · не действующая карточка VOIS</text></svg>