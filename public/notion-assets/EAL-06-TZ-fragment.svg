<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="850" viewBox="0 0 1680 850"><rect width="1680" height="850" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · РЕАЛЬНЫЙ ФРАГМЕНТ ТЗ ВНЕДРЕНИЯ</text><text x="48" y="105" font-family="Arial" font-size="38" font-weight="700" fill="#18273B">Требования, которые можно отдать исполнителям</text><rect x="48" y="155" width="1584" height="160" rx="20" fill="#FFFEFB" stroke="#D9D3C8"/><text x="78" y="200" font-family="Arial" font-size="21" font-weight="700" fill="#647C6E">01 · ДАННЫЕ / БИТРИКС24</text><text x="78" y="244" font-family="Arial" font-size="26" font-weight="700" fill="#18273B">Обязательные поля сделки</text><text x="78" y="282" font-family="Arial" font-size="20" fill="#243142">Источник · продукт · компания · роль · стадия · сигнал · критерий выбора · причина проигрыша · ключевые даты</text><rect x="48" y="335" width="1584" height="160" rx="20" fill="#FFFEFB" stroke="#D9D3C8"/><text x="78" y="380" font-family="Arial" font-size="21" font-weight="700" fill="#647C6E">02 · ФИНАНСЫ / АТРИБУЦИЯ</text><text x="78" y="424" font-family="Arial" font-size="26" font-weight="700" fill="#18273B">Связать сделку с фактическим результатом</text><text x="78" y="462" font-family="Arial" font-size="20" fill="#243142">Источник → продукт → договор → фактическая выручка / себестоимость / валовая прибыль</text><rect x="48" y="515" width="1584" height="220" rx="20" fill="#EEF3EE" stroke="#D9D3C8"/><text x="78" y="560" font-family="Arial" font-size="21" font-weight="700" fill="#647C6E">03 · ПРОДУКТЫ / САЙТ</text><text x="78" y="604" font-family="Arial" font-size="26" font-weight="700" fill="#18273B">Две страницы продуктов-ядра до масштабирования трафика</text><text x="78" y="642" font-family="Arial" font-size="20" fill="#243142">Регулярный импорт · проектная поставка оборудования</text><text x="78" y="680" font-family="Arial" font-size="20" fill="#243142">Критерий готовности: один продукт → один основной призыв → продуктовая форма → без недоказанных цифр</text></svg>