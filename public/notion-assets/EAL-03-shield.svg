<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="794" viewBox="0 0 1680 794"><rect width="1680" height="794" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · КОММЕРЧЕСКИЙ ЩИТ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">Как исследование стало коммерческой системой</text><rect x="48" y="150" width="163.86206896551724" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Ситуация</text><rect x="211.86206896551724" y="150" width="264" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="225.86206896551724" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Проблема</text><rect x="475.8620689655172" y="150" width="250.34482758620692" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="489.8620689655172" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Продукт</text><rect x="726.2068965517242" y="150" width="327.7241379310345" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="740.2068965517242" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Механизм</text><rect x="1053.9310344827586" y="150" width="304.9655172413793" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1067.9310344827586" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Доказательство</text><rect x="1358.896551724138" y="150" width="273.1034482758621" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1372.896551724138" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Показатель / повтор</text><rect x="48" y="208" width="163.86206896551724" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Регулярный</text><text x="62" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">импорт</text><rect x="211.86206896551724" y="208" width="264" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="225.86206896551724" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Раздробленная</text><text x="225.86206896551724" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственность и</text><text x="225.86206896551724" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ручная координация</text><rect x="475.8620689655172" y="208" width="250.34482758620692" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="489.8620689655172" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Управление регулярным</text><text x="489.8620689655172" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">импортом</text><rect x="726.2068965517242" y="208" width="327.7241379310345" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="740.2068965517242" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Диагностика → роли → статусы</text><text x="740.2068965517242" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">/ эскалации → исполнение</text><text x="740.2068965517242" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">согласованного контура</text><rect x="1053.9310344827586" y="208" width="304.9655172413793" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1067.9310344827586" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Пример нескольких циклов;</text><text x="1067.9310344827586" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">карта ролей; образец</text><text x="1067.9310344827586" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">статуса; план/факт</text><rect x="1358.896551724138" y="208" width="273.1034482758621" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1372.896551724138" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Источник → договор →</text><text x="1372.896551724138" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">фактическая валовая</text><text x="1372.896551724138" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">прибыль → повтор</text><rect x="48" y="320" width="163.86206896551724" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Проектный</text><text x="62" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">импорт</text><rect x="211.86206896551724" y="320" width="264" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="225.86206896551724" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Критический риск</text><text x="225.86206896551724" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">обнаруживается после</text><text x="225.86206896551724" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оплаты или слишком</text><text x="225.86206896551724" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поздно</text><rect x="475.8620689655172" y="320" width="250.34482758620692" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="489.8620689655172" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Проектная поставка</text><text x="489.8620689655172" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оборудования и</text><text x="489.8620689655172" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">комплектующих</text><rect x="726.2068965517242" y="320" width="327.7241379310345" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="740.2068965517242" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Спецификация → квалификация</text><text x="740.2068965517242" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">→ карта рисков → 1–3</text><text x="740.2068965517242" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сценария → обратный план</text><rect x="1053.9310344827586" y="320" width="304.9655172413793" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1067.9310344827586" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Похожие проекты; тех.</text><text x="1067.9310344827586" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">контрольный список; карта</text><text x="1067.9310344827586" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">рисков; границы</text><text x="1067.9310344827586" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственности</text><rect x="1358.896551724138" y="320" width="273.1034482758621" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1372.896551724138" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Проверка → расчёт →</text><text x="1372.896551724138" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">договор → план/факт</text><text x="1372.896551724138" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">отклонений</text><rect x="48" y="460" width="163.86206896551724" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Торговый</text><text x="62" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">импорт</text><rect x="211.86206896551724" y="460" width="264" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="225.86206896551724" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Сравниваются</text><text x="225.86206896551724" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">несопоставимые ставки и</text><text x="225.86206896551724" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поздние доплаты</text><rect x="475.8620689655172" y="460" width="250.34482758620692" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="489.8620689655172" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расчёт до склада +</text><text x="489.8620689655172" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">исполнение</text><rect x="726.2068965517242" y="460" width="327.7241379310345" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="740.2068965517242" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Минимум данных → 2–3</text><text x="740.2068965517242" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сценария → одинаковая точка</text><text x="740.2068965517242" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сравнения → цена / срок /</text><text x="740.2068965517242" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">риск</text><rect x="1053.9310344827586" y="460" width="304.9655172413793" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1067.9310344827586" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Постатейный расчёт;</text><text x="1067.9310344827586" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нормализация двух КП;</text><text x="1067.9310344827586" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">правила переменных статей</text><rect x="1358.896551724138" y="460" width="273.1034482758621" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1372.896551724138" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расчёт → переговоры →</text><text x="1372.896551724138" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">договор → фактическая</text><text x="1372.896551724138" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">маржа → повтор</text><rect x="48" y="600" width="163.86206896551724" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Первая /</text><text x="62" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">редкая</text><text x="62" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">поставка</text><rect x="211.86206896551724" y="600" width="264" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="225.86206896551724" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Клиент не понимает</text><text x="225.86206896551724" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">порядок действий и</text><text x="225.86206896551724" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">боится ошибиться до</text><text x="225.86206896551724" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оплаты</text><rect x="475.8620689655172" y="600" width="250.34482758620692" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="489.8620689655172" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Первая коммерческая</text><text x="489.8620689655172" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставка по понятному</text><text x="489.8620689655172" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">плану</text><rect x="726.2068965517242" y="600" width="327.7241379310345" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="740.2068965517242" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Квалификация → что проверить</text><text x="740.2068965517242" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">до оплаты → исполнимость →</text><text x="740.2068965517242" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">расчёт → официальное</text><text x="740.2068965517242" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">исполнение</text><rect x="1053.9310344827586" y="600" width="304.9655172413793" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1067.9310344827586" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Кейс первой поставки;</text><text x="1067.9310344827586" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">контрольный список;</text><text x="1067.9310344827586" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">договорная схема; «входит</text><text x="1067.9310344827586" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">/ не входит»</text><rect x="1358.896551724138" y="600" width="273.1034482758621" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1372.896551724138" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">План → расчёт → договор</text><text x="1372.896551724138" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">→ повтор / переход в</text><text x="1372.896551724138" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">основной продукт</text><text x="48" y="774" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>