<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="822" viewBox="0 0 1680 822"><rect width="1680" height="822" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · КОНКУРЕНТНЫЙ АНАЛИЗ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">Что уже стало нормой рынка — и где есть пространство для EAL</text><rect x="48" y="150" width="177.15789473684208" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Компания</text><rect x="225.15789473684208" y="150" width="343.89473684210526" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Публичное обещание</text><rect x="569.0526315789473" y="150" width="312.6315789473684" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Публичные доказательства</text><rect x="881.6842105263156" y="150" width="312.6315789473684" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Что стало нормой рынка</text><rect x="1194.315789473684" y="150" width="437.6842105263157" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Вывод для EAL</text><rect x="48" y="208" width="177.15789473684208" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">ROKOTT</text><rect x="225.15789473684208" y="208" width="343.89473684210526" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Одна команда закрывает</text><text x="239.15789473684208" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">закупки, ВЭД и логистику</text><rect x="569.0526315789473" y="208" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Срок работы, объёмы, кейсы</text><text x="583.0526315789473" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">и отраслевые сценарии</text><rect x="881.6842105263156" y="208" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">«Под ключ», единая</text><text x="895.6842105263156" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственность, кейсы</text><rect x="1194.315789473684" y="208" width="437.6842105263157" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Не спорить «мы тоже под ключ»; входить</text><text x="1208.315789473684" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">через 4 сценария и конкретный риск</text><rect x="48" y="292" width="177.15789473684208" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Frontera Group</text><rect x="225.15789473684208" y="292" width="343.89473684210526" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Цепочка от поставщика до</text><text x="239.15789473684208" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">склада</text><rect x="569.0526315789473" y="292" width="312.6315789473684" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Команда, комиссия,</text><text x="583.0526315789473" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Telegram, бот</text><rect x="881.6842105263156" y="292" width="312.6315789473684" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Персонализация экспертов и</text><text x="895.6842105263156" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">прозрачные условия</text><rect x="1194.315789473684" y="292" width="437.6842105263157" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Давать материалы для директора,</text><text x="1208.315789473684" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">финансов, техблока и ВЭД до выбора</text><text x="1208.315789473684" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">подрядчика</text><rect x="48" y="404" width="177.15789473684208" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">TNL Group</text><rect x="225.15789473684208" y="404" width="343.89473684210526" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Полный или частичный</text><text x="239.15789473684208" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">аутсорсинг ВЭД</text><rect x="569.0526315789473" y="404" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Подробный процесс, NDA,</text><text x="583.0526315789473" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">документы, FAQ</text><rect x="881.6842105263156" y="404" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Подробное объяснение</text><text x="895.6842105263156" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">механики услуги</text><rect x="1194.315789473684" y="404" width="437.6842105263157" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Усилить позицию «проверяем проект до</text><text x="1208.315789473684" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оплаты» и внутреннюю защиту решения</text><rect x="48" y="488" width="177.15789473684208" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">China Logist</text><rect x="225.15789473684208" y="488" width="343.89473684210526" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Комплексная закупка и поставка</text><text x="239.15789473684208" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">из Китая</text><rect x="569.0526315789473" y="488" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Масштаб, проекты,</text><text x="583.0526315789473" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">инфраструктура</text><rect x="881.6842105263156" y="488" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Китайская специализация и</text><text x="895.6842105263156" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">широкий набор услуг</text><rect x="1194.315789473684" y="488" width="437.6842105263157" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Не соревноваться масштабом; быть</text><text x="1208.315789473684" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">точнее в диагностике конкретной задачи</text><rect x="48" y="572" width="177.15789473684208" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">BOX CARGO</text><rect x="225.15789473684208" y="572" width="343.89473684210526" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Полное сопровождение ВЭД с</text><text x="239.15789473684208" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Китаем</text><rect x="569.0526315789473" y="572" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Этапы, проверки качества и</text><text x="583.0526315789473" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">документов</text><rect x="881.6842105263156" y="572" width="312.6315789473684" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Белый импорт и понятный</text><text x="895.6842105263156" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">перечень этапов</text><rect x="1194.315789473684" y="572" width="437.6842105263157" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Показать управленческую логику выбора:</text><text x="1208.315789473684" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">расчёт до одной точки + карта рисков</text><rect x="48" y="656" width="177.15789473684208" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">NEW WAY</text><rect x="225.15789473684208" y="656" width="343.89473684210526" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="239.15789473684208" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Управляемая поставка с</text><text x="239.15789473684208" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">цифровым сопровождением</text><rect x="569.0526315789473" y="656" width="312.6315789473684" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="583.0526315789473" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Маршруты, личный кабинет,</text><text x="583.0526315789473" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">новости</text><rect x="881.6842105263156" y="656" width="312.6315789473684" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="895.6842105263156" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Цифровые статусы и</text><text x="895.6842105263156" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">информационная прозрачность</text><rect x="1194.315789473684" y="656" width="437.6842105263157" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1208.315789473684" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Если нет кабинета — компенсировать</text><text x="1208.315789473684" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">стандартом статуса, паспортом поставки</text><text x="1208.315789473684" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">и эскалацией</text><text x="48" y="802" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>