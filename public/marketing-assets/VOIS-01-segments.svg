<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="850" viewBox="0 0 1680 850"><rect width="1680" height="850" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">VOIS · ИССЛЕДОВАНИЕ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">Сегменты — не по возрасту, а по задаче выбора</text><rect x="48" y="150" width="245.14285714285714" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Сегмент</text><rect x="293.1428571428571" y="150" width="282.85714285714283" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Главная задача</text><rect x="576" y="150" width="330" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Проблема / барьер</text><rect x="906" y="150" width="320.57142857142856" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Критерий выбора</text><rect x="1226.5714285714284" y="150" width="405.42857142857144" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Что должно доказать предложение</text><rect x="48" y="208" width="245.14285714285714" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Ценящие простоту</text><rect x="293.1428571428571" y="208" width="282.85714285714283" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Решить задачу</text><text x="307.1428571428571" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">минимальным числом</text><text x="307.1428571428571" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">действий</text><rect x="576" y="208" width="330" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Липкость, долгий ритуал,</text><text x="590" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ощущение навязанной</text><text x="590" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">многоступенчатой системы</text><rect x="906" y="208" width="320.57142857142856" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Простота применения;</text><text x="920" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">комфорт; один продукт</text><text x="920" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">закрывает понятную задачу</text><rect x="1226.5714285714284" y="208" width="405.42857142857144" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Понятное применение, комфорт и</text><text x="1240.5714285714284" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">отсутствие ненужных шагов</text><rect x="48" y="320" width="245.14285714285714" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Решающие конкретную</text><text x="62" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">проблему</text><rect x="293.1428571428571" y="320" width="282.85714285714283" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Получить наблюдаемый</text><text x="307.1428571428571" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">результат без лишнего</text><text x="307.1428571428571" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">риска</text><rect x="576" y="320" width="330" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Нет результата; реакция;</text><text x="590" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">непонятно, сколько ждать;</text><text x="590" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">противоречивые отзывы</text><rect x="906" y="320" width="320.57142857142856" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Понятное обещание;</text><text x="920" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доказательства; ожидания по</text><text x="920" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сроку; безопасное применение</text><rect x="1226.5714285714284" y="320" width="405.42857142857144" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Результат, ожидания, срок оценки,</text><text x="1240.5714285714284" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">применение и ограничения</text><rect x="48" y="432" width="245.14285714285714" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Ценящие комфорт</text><rect x="293.1428571428571" y="432" width="282.85714285714283" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Регулярно пользоваться</text><text x="307.1428571428571" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">без дискомфорта</text><rect x="576" y="432" width="330" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Липкость, жирность, тяжёлое</text><text x="590" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">смывание, запах или</text><text x="590" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">неприятное ощущение</text><rect x="906" y="432" width="320.57142857142856" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Текстура; впитывание; запах;</text><text x="920" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">смывание; ощущение после</text><text x="920" y="524" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нанесения</text><rect x="1226.5714285714284" y="432" width="405.42857142857144" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Текстура, впитывание, запах,</text><text x="1240.5714285714284" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">смывание и ощущения</text><rect x="48" y="544" width="245.14285714285714" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Ориентированные на</text><text x="62" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">повтор и выгоду</text><rect x="293.1428571428571" y="544" width="282.85714285714283" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Повторить то, что уже</text><text x="307.1428571428571" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">подошло, проще и</text><text x="307.1428571428571" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">выгоднее</text><rect x="576" y="544" width="330" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Сложный повтор, сменный</text><text x="590" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">блок, версии, цена одного</text><text x="590" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">использования</text><rect x="906" y="544" width="320.57142857142856" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Стабильный опыт;</text><text x="920" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">совместимость; стоимость</text><text x="920" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">одного использования;</text><text x="920" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">удобный повтор</text><rect x="1226.5714285714284" y="544" width="405.42857142857144" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Простой повтор, совместимость</text><text x="1240.5714285714284" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">версий и сменного блока</text><rect x="48" y="684" width="245.14285714285714" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Нуждающиеся в помощи</text><text x="62" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">с выбором</text><rect x="293.1428571428571" y="684" width="282.85714285714283" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="307.1428571428571" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Быстро понять, какой</text><text x="307.1428571428571" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">вариант подходит</text><rect x="576" y="684" width="330" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="590" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Похожие товары кажутся</text><text x="590" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">взаимозаменяемыми; сложно</text><text x="590" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сравнить</text><rect x="906" y="684" width="320.57142857142856" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="920" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Навигация по потребности;</text><text x="920" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">простое сравнение;</text><text x="920" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">рекомендации; доказательства</text><rect x="1226.5714285714284" y="684" width="405.42857142857144" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1240.5714285714284" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Короткое сравнение, понятные</text><text x="1240.5714285714284" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">критерии и отсутствие имитации</text><text x="1240.5714285714284" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">диагностики</text><text x="48" y="830" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>