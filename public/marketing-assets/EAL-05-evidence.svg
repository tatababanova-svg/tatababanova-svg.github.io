<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="932" viewBox="0 0 1680 932"><rect width="1680" height="932" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · РЕЕСТР ДОКАЗАТЕЛЬНОСТИ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">Что можно утверждать, а что нельзя выдавать за факт</text><rect x="48" y="150" width="173.85365853658536" height="84" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Блок</text><rect x="221.85365853658536" y="150" width="405.6585365853658" height="84" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Утверждение / тезис</text><rect x="627.5121951219512" y="150" width="251.1219512195122" height="84" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Статус</text><text x="641.5121951219512" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">доказательности</text><rect x="878.6341463414634" y="150" width="202.8292682926829" height="84" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Публично?</text><rect x="1081.4634146341464" y="150" width="550.5365853658536" height="84" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Безопасная формулировка</text><rect x="48" y="234" width="173.85365853658536" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Услуги EAL</text><rect x="221.85365853658536" y="234" width="405.6585365853658" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL оказывает услуги аутсорсинга</text><text x="235.85365853658536" y="298" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ВЭД.</text><rect x="627.5121951219512" y="234" width="251.1219512195122" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ПОДТВЕРЖДЕНО</text><rect x="878.6341463414634" y="234" width="202.8292682926829" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ДА</text><rect x="1081.4634146341464" y="234" width="550.5365853658536" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="270" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL оказывает услуги аутсорсинга ВЭД с</text><text x="1095.4634146341464" y="298" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">согласованным составом функций.</text><rect x="48" y="318" width="173.85365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Услуги EAL</text><rect x="221.85365853658536" y="318" width="405.6585365853658" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL работает с доставкой</text><text x="235.85365853658536" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оборудования.</text><rect x="627.5121951219512" y="318" width="251.1219512195122" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ПОДТВЕРЖДЕНО</text><rect x="878.6341463414634" y="318" width="202.8292682926829" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ДА</text><rect x="1081.4634146341464" y="318" width="550.5365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="354" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL оказывает услуги по международной доставке</text><text x="1095.4634146341464" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">оборудования; конкретная схема зависит от груза</text><text x="1095.4634146341464" y="410" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">и проекта.</text><rect x="48" y="430" width="173.85365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Профиль клиента</text><rect x="221.85365853658536" y="430" width="405.6585365853658" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL работает с коммерческими</text><text x="235.85365853658536" y="494" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">грузами; личные вещи не являются</text><text x="235.85365853658536" y="522" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">основным профилем.</text><rect x="627.5121951219512" y="430" width="251.1219512195122" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ПОДТВЕРЖДЕНО ЧАСТИЧНО</text><rect x="878.6341463414634" y="430" width="202.8292682926829" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ДА, С ОГОВОРКОЙ</text><rect x="1081.4634146341464" y="430" width="550.5365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="466" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL сфокусирован на коммерческих поставках для</text><text x="1095.4634146341464" y="494" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">бизнеса; возможность перевозки подтверждается по</text><text x="1095.4634146341464" y="522" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">товару и задаче.</text><rect x="48" y="542" width="173.85365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Продуктовая</text><text x="62" y="606" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">стратегия</text><rect x="221.85365853658536" y="542" width="405.6585365853658" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">«Управление регулярным импортом» —</text><text x="235.85365853658536" y="606" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">приоритетное ядро №1.</text><rect x="627.5121951219512" y="542" width="251.1219512195122" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">РАБОЧАЯ ГИПОТЕЗА</text><rect x="878.6341463414634" y="542" width="202.8292682926829" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">НЕТ КАК ФАКТ</text><rect x="1081.4634146341464" y="542" width="550.5365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="578" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Для компаний с регулярным импортом EAL</text><text x="1095.4634146341464" y="606" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">предлагает разобрать текущую схему и определить,</text><text x="1095.4634146341464" y="634" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">что целесообразно передать наружу.</text><rect x="48" y="654" width="173.85365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Продуктовая</text><text x="62" y="718" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">стратегия</text><rect x="221.85365853658536" y="654" width="405.6585365853658" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">«Проектная поставка оборудования и</text><text x="235.85365853658536" y="718" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">комплектующих» — ядро №2.</text><rect x="627.5121951219512" y="654" width="251.1219512195122" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">РАБОЧАЯ ГИПОТЕЗА</text><rect x="878.6341463414634" y="654" width="202.8292682926829" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">НЕТ КАК ФАКТ</text><rect x="1081.4634146341464" y="654" width="550.5365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Для сложных проектных поставок EAL предлагает</text><text x="1095.4634146341464" y="718" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">начинать с предварительной проверки исполнимости</text><text x="1095.4634146341464" y="746" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">и рисков.</text><rect x="48" y="766" width="173.85365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="802" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Позиционирование</text><rect x="221.85365853658536" y="766" width="405.6585365853658" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="235.85365853658536" y="802" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">«EAL. Сначала схема. Потом</text><text x="235.85365853658536" y="830" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставка.» — основа</text><text x="235.85365853658536" y="858" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">позиционирования.</text><rect x="627.5121951219512" y="766" width="251.1219512195122" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="641.5121951219512" y="802" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">РАБОЧАЯ ГИПОТЕЗА</text><rect x="878.6341463414634" y="766" width="202.8292682926829" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="892.6341463414634" y="802" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">КАК КОНЦЕПЦИЯ</text><rect x="1081.4634146341464" y="766" width="550.5365853658536" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1095.4634146341464" y="802" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">EAL предлагает сначала проверить исходные</text><text x="1095.4634146341464" y="830" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">данные, ограничения, роли и рабочую схему, а</text><text x="1095.4634146341464" y="858" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">затем запускать поставку.</text><text x="48" y="912" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>