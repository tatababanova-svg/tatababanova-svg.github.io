<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1102" viewBox="0 0 1680 1102"><rect width="1680" height="1102" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">VOIS · ПРОВЕРКА</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">8 экспериментов: гипотеза → показатель → решение</text><rect x="48" y="150" width="70.71428571428571" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Код</text><rect x="118.71428571428571" y="150" width="268.7142857142857" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Эксперимент</text><rect x="387.42857142857144" y="150" width="471.42857142857144" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Что меняем</text><rect x="858.8571428571429" y="150" width="377.1428571428571" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Основной показатель</text><rect x="1236" y="150" width="396" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Решение после проверки</text><rect x="48" y="208" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э1</text><rect x="118.71428571428571" y="208" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Карточка товара:</text><text x="132.71428571428572" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">результат + ожидания</text><rect x="387.42857142857144" y="208" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Блок: задача → наблюдаемый результат →</text><text x="401.42857142857144" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">когда оценивать → кому подходит → как</text><text x="401.42857142857144" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">применять</text><rect x="858.8571428571429" y="208" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доля посетителей карточки,</text><text x="872.8571428571429" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">добавивших товар в корзину</text><rect x="1236" y="208" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Масштабировать / доработать и</text><text x="1250" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">повторить / остановить / данных</text><text x="1250" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">недостаточно</text><rect x="48" y="320" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э2</text><rect x="118.71428571428571" y="320" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Лёгкий подбор по</text><text x="132.71428571428572" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">потребности</text><rect x="387.42857142857144" y="320" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">3 вопроса → 2–3 релевантных варианта →</text><text x="401.42857142857144" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">понятное сравнение</text><rect x="858.8571428571429" y="320" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доля пользователей, дошедших из</text><text x="872.8571428571429" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">подбора до релевантной карточки</text><text x="872.8571428571429" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">и корзины</text><rect x="1236" y="320" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Оставить как модуль / изменить</text><text x="1250" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">вопросы / отказаться</text><rect x="48" y="432" width="70.71428571428571" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э3</text><rect x="118.71428571428571" y="432" width="268.7142857142857" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Подсказки для первого</text><text x="132.71428571428572" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">использования</text><rect x="387.42857142857144" y="432" width="471.42857142857144" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">После доставки: количество, частота,</text><text x="401.42857142857144" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нанесение / смывание, ожидаемые ощущения</text><rect x="858.8571428571429" y="432" width="377.1428571428571" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доля обращений и отзывов о</text><text x="872.8571428571429" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">непонимании применения</text><rect x="1236" y="432" width="396" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расширить / скорректировать</text><text x="1250" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">инструкцию / остановить</text><rect x="48" y="516" width="70.71428571428571" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э4</text><rect x="118.71428571428571" y="516" width="268.7142857142857" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Ясное объяснение новой</text><text x="132.71428571428572" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">версии</text><rect x="387.42857142857144" y="516" width="471.42857142857144" height="84" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Что изменилось / что осталось / как</text><text x="401.42857142857144" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">отличить / что совместимо</text><rect x="858.8571428571429" y="516" width="377.1428571428571" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Вопросы и жалобы о версиях;</text><text x="872.8571428571429" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">несоответствие ожиданий</text><rect x="1236" y="516" width="396" height="84" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расширить / повторить / остановить</text><text x="1250" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">при несопоставимости</text><rect x="48" y="600" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э5</text><rect x="118.71428571428571" y="600" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Сменный блок как</text><text x="132.71428571428572" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">простой повтор</text><rect x="387.42857142857144" y="600" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Показать совместимый сменный блок,</text><text x="401.42857142857144" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">установку и разницу с полной упаковкой</text><rect x="858.8571428571429" y="600" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доля покупателей основной</text><text x="872.8571428571429" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">упаковки, выбравших сменный блок</text><text x="872.8571428571429" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">при повторе</text><rect x="1236" y="600" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расширить / изменить подачу /</text><text x="1250" y="664" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">отказаться</text><rect x="48" y="712" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э6</text><rect x="118.71428571428571" y="712" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Материалы авторов как</text><text x="132.71428571428572" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">повторно используемое</text><text x="132.71428571428572" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доказательство</text><rect x="387.42857142857144" y="712" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Один подтверждённый фрагмент опыта</text><text x="401.42857142857144" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">использовать у автора, в карточке и</text><text x="401.42857142857144" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">собственном канале</text><rect x="858.8571428571429" y="712" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Результативность доказательного</text><text x="872.8571428571429" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">материала в конкретной точке</text><text x="872.8571428571429" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">пути</text><rect x="1236" y="712" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Создать библиотеку модулей /</text><text x="1250" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">уточнить форматы / оставить для</text><text x="1250" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">отдельных каналов</text><rect x="48" y="824" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э7</text><rect x="118.71428571428571" y="824" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Дополнительный товар от</text><text x="132.71428571428572" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">новой задачи</text><rect x="387.42857142857144" y="824" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Вместо общего блока связанных товаров</text><text x="401.42857142857144" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">показать 1–2 средства под следующую</text><text x="401.42857142857144" y="916" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">задачу</text><rect x="858.8571428571429" y="824" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Количество товаров в заказе или</text><text x="872.8571428571429" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доля заказов с дополнительным</text><text x="872.8571428571429" y="916" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">товаром</text><rect x="1236" y="824" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="860" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Масштабировать прибыльные связки /</text><text x="1250" y="888" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доработать / остановить</text><rect x="48" y="936" width="70.71428571428571" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Э8</text><rect x="118.71428571428571" y="936" width="268.7142857142857" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="132.71428571428572" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Доказательства в</text><text x="132.71428571428572" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">розничной точке</text><rect x="387.42857142857144" y="936" width="471.42857142857144" height="112" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="401.42857142857144" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Навигация по потребности + ожидаемый</text><text x="401.42857142857144" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">результат + быстрый переход к</text><text x="401.42857142857144" y="1028" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доказательствам</text><rect x="858.8571428571429" y="936" width="377.1428571428571" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="872.8571428571429" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Продажи товара на магазин за</text><text x="872.8571428571429" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сопоставимый период или</text><text x="872.8571428571429" y="1028" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доступная конверсия</text><rect x="1236" y="936" width="396" height="112" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1250" y="972" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Расширить / повторить на</text><text x="1250" y="1000" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">сопоставимой выборке / остановить</text><text x="48" y="1082" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>