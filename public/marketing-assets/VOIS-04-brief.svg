<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940"><rect width="1680" height="940" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">VOIS · РЕАЛЬНЫЙ ФРАГМЕНТ ТЗ</text><text x="48" y="105" font-family="Arial" font-size="38" font-weight="700" fill="#18273B">Карточка товара: что должен увидеть дизайнер</text><text x="48" y="145" font-family="Arial" font-size="20" fill="#6F7781">Основа — рабочая страница «Пример улучшенной карточки — увлажняющая сыворотка».</text>
<rect x="48" y="190" width="1584" height="103" rx="16" fill="#FFFEFB" stroke="#D9D3C8"/><text x="70" y="228" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">01</text><text x="138" y="228" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">Первый экран</text><text x="138" y="263" font-family="Arial" font-size="19" fill="#243142">Задача продукта + кому подходит + основная упаковка / сменный блок.</text><rect x="48" y="305" width="1584" height="103" rx="16" fill="#FFFEFB" stroke="#D9D3C8"/><text x="70" y="343" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">02</text><text x="138" y="343" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">«Подойдёт, если»</text><text x="138" y="378" font-family="Arial" font-size="19" fill="#243142">4 коротких критерия вместо длинного описания.</text><rect x="48" y="420" width="1584" height="103" rx="16" fill="#FFFEFB" stroke="#D9D3C8"/><text x="70" y="458" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">03</text><text x="138" y="458" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">Сравнение до покупки</text><text x="138" y="493" font-family="Arial" font-size="19" fill="#243142">2–3 близких товара по одинаковым критериям; сравнение только после проверки формул и инструкций.</text><rect x="48" y="535" width="1584" height="103" rx="16" fill="#FFFEFB" stroke="#D9D3C8"/><text x="70" y="573" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">04</text><text x="138" y="573" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">Что подтверждено</text><text x="138" y="608" font-family="Arial" font-size="19" fill="#243142">Источник + выборка + ограничение; не превращать исследование марки в гарантию результата.</text><rect x="48" y="650" width="1584" height="103" rx="16" fill="#FFFEFB" stroke="#D9D3C8"/><text x="70" y="688" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">05</text><text x="138" y="688" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">Как использовать</text><text x="138" y="723" font-family="Arial" font-size="19" fill="#243142">Дозировка, частота, совместимость с базовым уходом, индивидуальная чувствительность.</text><rect x="48" y="765" width="1584" height="103" rx="16" fill="#EEF3EE" stroke="#D9D3C8"/><text x="70" y="803" font-family="Arial" font-size="19" font-weight="700" fill="#647C6E">06</text><text x="138" y="803" font-family="Arial" font-size="24" font-weight="700" fill="#18273B">Повторная покупка</text><text x="138" y="838" font-family="Arial" font-size="19" fill="#243142">Основная упаковка + совместимый сменный блок + инструкция по установке.</text></svg>