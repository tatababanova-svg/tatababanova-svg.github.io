<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="878" viewBox="0 0 1680 878"><rect width="1680" height="878" fill="#F7F3EC"/><text x="48" y="54" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#647C6E">EAL · ИССЛЕДОВАНИЕ</text><text x="48" y="105" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18273B">Как различаются четыре ситуации покупки</text><rect x="48" y="150" width="185.77777777777777" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Сегмент</text><rect x="233.77777777777777" y="150" width="229.77777777777777" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="247.77777777777777" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Ситуация</text><rect x="463.55555555555554" y="150" width="293.3333333333333" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="477.55555555555554" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Главная боль</text><rect x="756.8888888888889" y="150" width="254.2222222222222" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="770.8888888888889" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Главный страх</text><rect x="1011.1111111111111" y="150" width="298.22222222222223" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1025.111111111111" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Критерий выбора</text><rect x="1309.3333333333333" y="150" width="322.66666666666663" height="58" fill="#18273B" stroke="#D9D3C8" stroke-width="1"/><text x="1323.3333333333333" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Что убеждает</text><rect x="48" y="208" width="185.77777777777777" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Регулярный</text><text x="62" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">импорт</text><rect x="233.77777777777777" y="208" width="229.77777777777777" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="247.77777777777777" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Много поставок,</text><text x="247.77777777777777" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставщиков и ручных</text><text x="247.77777777777777" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">стыков</text><rect x="463.55555555555554" y="208" width="293.3333333333333" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="477.55555555555554" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Координация съедает время</text><text x="477.55555555555554" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">команды; статусы и</text><text x="477.55555555555554" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственность</text><text x="477.55555555555554" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">разрознены</text><rect x="756.8888888888889" y="208" width="254.2222222222222" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="770.8888888888889" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Потерять контроль и</text><text x="770.8888888888889" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">стать зависимым от</text><text x="770.8888888888889" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">подрядчика</text><rect x="1011.1111111111111" y="208" width="298.22222222222223" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1025.111111111111" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Опыт повторных циклов;</text><text x="1025.111111111111" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">регламент статусов; зоны</text><text x="1025.111111111111" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственности;</text><text x="1025.111111111111" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">финансовая прозрачность</text><rect x="1309.3333333333333" y="208" width="322.66666666666663" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1323.3333333333333" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Карта «что остаётся внутри /</text><text x="1323.3333333333333" y="272" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">что передать»; образец</text><text x="1323.3333333333333" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">статуса; 2–3 повторных</text><text x="1323.3333333333333" y="328" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">цикла; расчёт нагрузки</text><rect x="48" y="348" width="185.77777777777777" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Производственный</text><text x="62" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">/ проектный</text><text x="62" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">импорт</text><rect x="233.77777777777777" y="348" width="229.77777777777777" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="247.77777777777777" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Оборудование, линия,</text><text x="247.77777777777777" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">критичные</text><text x="247.77777777777777" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">комплектующие;</text><text x="247.77777777777777" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставка привязана к</text><text x="247.77777777777777" y="496" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">запуску</text><rect x="463.55555555555554" y="348" width="293.3333333333333" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="477.55555555555554" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Высокая цена ошибки;</text><text x="477.55555555555554" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">документы, упаковка и</text><text x="477.55555555555554" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">маршрут могут остановить</text><text x="477.55555555555554" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">проект</text><rect x="756.8888888888889" y="348" width="254.2222222222222" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="770.8888888888889" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Срыв запуска,</text><text x="770.8888888888889" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">повреждение груза,</text><text x="770.8888888888889" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">нехватка документов,</text><text x="770.8888888888889" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">рост бюджета</text><rect x="1011.1111111111111" y="348" width="298.22222222222223" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1025.111111111111" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Опыт похожего груза;</text><text x="1025.111111111111" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">проверка схемы до оплаты;</text><text x="1025.111111111111" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">карта рисков; обратный</text><text x="1025.111111111111" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">план</text><rect x="1309.3333333333333" y="348" width="322.66666666666663" height="168" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1323.3333333333333" y="384" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Карта рисков; обратный</text><text x="1323.3333333333333" y="412" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">календарь; аналогичный кейс;</text><text x="1323.3333333333333" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">технический контрольный</text><text x="1323.3333333333333" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">список</text><rect x="48" y="516" width="185.77777777777777" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Торговый импорт</text><rect x="233.77777777777777" y="516" width="229.77777777777777" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="247.77777777777777" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Партия товара,</text><text x="247.77777777777777" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">несколько</text><text x="247.77777777777777" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставщиков и</text><text x="247.77777777777777" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">котировок</text><rect x="463.55555555555554" y="516" width="293.3333333333333" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="477.55555555555554" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Предложения</text><text x="477.55555555555554" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">несопоставимы; поздние</text><text x="477.55555555555554" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">доплаты меняют итоговую</text><text x="477.55555555555554" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">стоимость</text><rect x="756.8888888888889" y="516" width="254.2222222222222" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="770.8888888888889" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Потерять маржу и сезон</text><text x="770.8888888888889" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">из-за скрытых расходов</text><text x="770.8888888888889" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">или срока</text><rect x="1011.1111111111111" y="516" width="298.22222222222223" height="140" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1025.111111111111" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Постатейный расчёт до</text><text x="1025.111111111111" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">склада; скорость;</text><text x="1025.111111111111" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">одинаковая база сравнения;</text><text x="1025.111111111111" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ясные допущения</text><rect x="1309.3333333333333" y="516" width="322.66666666666663" height="140" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1323.3333333333333" y="552" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Нормализация 2–3</text><text x="1323.3333333333333" y="580" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">предложений; сценарии</text><text x="1323.3333333333333" y="608" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">цена/срок; пример «ставка vs</text><text x="1323.3333333333333" y="636" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">итог»</text><rect x="48" y="656" width="185.77777777777777" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="62" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">Первая / редкая</text><text x="62" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#243142">поставка</text><rect x="233.77777777777777" y="656" width="229.77777777777777" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="247.77777777777777" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Компания импортирует</text><text x="247.77777777777777" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">впервые или</text><text x="247.77777777777777" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">эпизодически</text><rect x="463.55555555555554" y="656" width="293.3333333333333" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="477.55555555555554" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Неясен порядок действий,</text><text x="477.55555555555554" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">документов, денег и</text><text x="477.55555555555554" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">ответственности</text><rect x="756.8888888888889" y="656" width="254.2222222222222" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="770.8888888888889" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Оплатить товар и</text><text x="770.8888888888889" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">столкнуться с</text><text x="770.8888888888889" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">запретом, доплатами</text><text x="770.8888888888889" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">или непонятным</text><text x="770.8888888888889" y="804" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">договором</text><rect x="1011.1111111111111" y="656" width="298.22222222222223" height="168" fill="#FFFEFB" stroke="#D9D3C8" stroke-width="1"/><text x="1025.111111111111" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">Ясность процесса; список</text><text x="1025.111111111111" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">шагов; прозрачный расчёт;</text><text x="1025.111111111111" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">опыт похожей задачи</text><rect x="1309.3333333333333" y="656" width="322.66666666666663" height="168" fill="#EEF3EE" stroke="#D9D3C8" stroke-width="1"/><text x="1323.3333333333333" y="692" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">План 7 шагов; список данных;</text><text x="1323.3333333333333" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">пример документов; расчёт с</text><text x="1323.3333333333333" y="748" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">допущениями; кейс первой</text><text x="1323.3333333333333" y="776" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#243142">поставки</text><text x="48" y="858" font-family="Arial, sans-serif" font-size="17" fill="#7B817F">Витринный фрагмент · сокращение существующего рабочего материала без новой аналитики</text></svg>